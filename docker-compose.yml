services:
  postgres-app:
    image: postgres:16
    container_name: postgres-app
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite
      POSTGRES_DB: quickbite_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

  storage:
    image: chrislusf/seaweedfs:4.47
    container_name: storage
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - storage_data:/data

volumes:
  postgres_app_data:
  storage_data: