services:
  postgres-app:
    image: postgres:16
    container_name: postgres-app
    environment:
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite
      POSTGRES_DB: quickbite_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

volumes:
  postgres_app_data: